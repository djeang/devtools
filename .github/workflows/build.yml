name: Build
on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JeKa
        run: |
          curl -sL https://jeka.dev/install.sh | bash -s - install
          echo "$HOME/.jeka/bin" >> "$GITHUB_PATH"

      - name: Build with JeKa
        run: jeka project: pack
